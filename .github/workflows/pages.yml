name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp -r index.html app.js config.js favicon.svg vendor bibliografia _site/
          cp .nojekyll _site/ 2>/dev/null || true

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
